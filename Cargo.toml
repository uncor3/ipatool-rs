[package]
name = "ipatool"
version = "0.3.2"
edition = "2024"
description = "Download IPAs directly from Apple, a pure Rust port of ipatool."
license = "MIT"
repository = "https://github.com/uncor3/ipatool-rs"
keywords = ["ipatool", "ios", "apple", "ipa", "downloader", ]
authors = ["uncor3 <github.com/uncor3>"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "stream", "query"] }
reqwest_cookie_store = "0.10"
cookie_store = "0.22"

keyring = { version = "3", default-features = false }
jose4rs = "0.6"
secrecy = "0.10"
zeroize = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

plist = "1"
url = "2"

zip = { version = "2", default-features = false, features = ["deflate"] }
bytes = "1"
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "parsing"] }

clap = { version = "4.5", features = ["derive"] , optional = true }
rpassword = { version = "7", optional = true }
dirs = "5"
mac_address = "1"
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "0.22"
phf = { version = "0.11", features = ["macros"] }
sha2 = "0.10"
quick-xml = "0.37"
bzip2 = "0.6"
libloading = "0.8"
sevenz-rust2 = "0.22"
ruzstd = "0.9"
tar = "0.4"
getrandom = "0.3"
httpdate = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }


[features]
default = ["cli"]
cli = ["dep:clap", "dep:tracing-subscriber", "dep:rpassword"]

[[bin]]
name = "ipatool-rs"
path = "src/bin/ipatool-rs.rs"
required-features = ["cli"]
